name: Windows EXE

on:
  push:
    branches: [main, master]
    paths:
      - "pc/**"
      - ".github/workflows/windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pc/requirements.txt pyinstaller

      - name: Build portable Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name SubtitleFlow --collect-all whisper --collect-all torch --collect-all tiktoken --collect-all numba --collect-all llvmlite pc/desktop_app.py
          if (!(Test-Path "dist/SubtitleFlow/SubtitleFlow.exe")) {
            throw "SubtitleFlow.exe was not created."
          }
          Copy-Item README.md dist/SubtitleFlow/README.md
          Copy-Item LICENSE dist/SubtitleFlow/LICENSE
          Compress-Archive -Path "dist/SubtitleFlow/*" -DestinationPath "SubtitleFlow-Windows-x64.zip" -CompressionLevel Optimal

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleFlow-Windows-x64
          path: SubtitleFlow-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
