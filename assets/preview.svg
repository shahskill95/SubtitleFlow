<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">SubtitleFlow desktop and Android interface preview</title>
  <desc id="desc">Dark navy interface with mint accents, desktop video selection and a matching Android mobile client.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14263a"/><stop offset="1" stop-color="#080d19"/></linearGradient>
