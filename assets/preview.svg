    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".36"/></filter>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <circle cx="260" cy="20" r="390" fill="#1c4550" opacity=".16"/>
  <circle cx="1130" cy="700" r="330" fill="#1c4550" opacity=".12"/>
