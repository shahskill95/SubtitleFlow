    <rect x="991" y="484" width="25" height="22" rx="6" fill="#123739"/><text x="1003" y="499" text-anchor="middle" fill="#72e6ca" font-size="8" font-weight="800">02</text>
    <text x="1025" y="499" fill="#f4f7fc" font-size="8" font-weight="800" letter-spacing=".7">ПАРАМЕТРЫ</text>
