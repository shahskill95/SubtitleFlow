    <text x="991" y="540" fill="#9aaabf" font-size="8">Модель</text><text x="1092" y="540" fill="#f4f7fc" font-size="8">base ▾</text>
    <rect x="978" y="565" width="211" height="47" rx="12" fill="#72e6ca"/>
